name: Fetch World Bank monthly prices
on:
  schedule:
    - cron: "0 8 * * *"      # 08:00 UTC every day, see note below
  workflow_dispatch:          # lets you run it manually
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find current XLS link and download
        run: |
          URL=$(curl -sL -A "Mozilla/5.0" https://www.worldbank.org/commodities \
            | grep -oE 'https://thedocs\.worldbank\.org[^"]*CMO-Historical-Data-Monthly\.xlsx' | head -1)
          echo "Found: $URL"
          # fallback to the November 2026 link if scraping fails
          URL=${URL:-"https://thedocs.worldbank.org/en/doc/74e8be41ceb20fa0da750cda2f6b9e4e-0050012026/related/CMO-Historical-Data-Monthly.xlsx"}
          curl -fsSL -A "Mozilla/5.0" -o CMO-Historical-Data-Monthly.xlsx "$URL"

      - name: Extract last three values
        run: |
          pip install openpyxl
          python scripts/extract.py
          cat latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add CMO-Historical-Data-Monthly.xlsx latest.md
          git diff --staged --quiet || (git commit -m "Update monthly prices" && git push)
