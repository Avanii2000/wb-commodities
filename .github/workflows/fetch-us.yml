name: US producer prices (FRED)
on:
  schedule:
    - cron: "0 5 * * *"      # 05:00 UTC every day
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch from FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 scripts/fetch_fred_ppi.py
      - name: Show log
        if: always()
        run: cat probe/fred/log.txt >> "$GITHUB_STEP_SUMMARY" || true
      - name: Commit results
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          for f in price_raw_us.json probe/fred/log.txt probe/fred/us_series_list.csv probe/fred/raw_sample.txt probe/fred/rejected_result.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --staged --quiet || (git commit -m "US producer prices (FRED)" && git pull --rebase --autostash && git push)
