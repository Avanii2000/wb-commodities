name: Fetch World Bank monthly prices
on:
  schedule:
    - cron: "00 5 * * *"      # 05:00 UTC every day
  workflow_dispatch:          # lets you run it manually
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find current XLS link and download
        run: |
          curl -sL -A "Mozilla/5.0" https://www.worldbank.org/commodities -o page.html
          URL=$(grep -oE 'https://thedocs\.worldbank\.org[^"]*CMO-Historical-Data-Monthly\.xlsx' page.html | head -1)
          echo "Found: $URL"
          if [ -z "$URL" ]; then
            echo "::warning::Scraping failed, using fallback link (data may be outdated)"
          fi
          # fallback to the November 2026 link if scraping fails
          URL=${URL:-"https://thedocs.worldbank.org/en/doc/74e8be41ceb20fa0da750cda2f6b9e4e-0050012026/related/CMO-Historical-Data-Monthly.xlsx"}
          curl -fsSL -A "Mozilla/5.0" -o CMO-Historical-Data-Monthly.xlsx "$URL"

      - name: Extract sugar and aluminum (quick check)
        run: |
          pip install openpyxl
          python scripts/extract.py
          cat latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build price_raw.json for the insights
        run: |
          python scripts/build_price_raw.py \
            --xlsx CMO-Historical-Data-Monthly.xlsx \
            --page page.html \
            --out price_raw.json \
            --insights insights.md
          cat insights.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add CMO-Historical-Data-Monthly.xlsx latest.md price_raw.json insights.md
          git diff --staged --quiet || (git commit -m "Update monthly prices" && git pull --rebase --autostash && git push)
