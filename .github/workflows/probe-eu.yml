name: Probe EU agri-food API
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run probe
        run: |
          python scripts/probe_eu_api.py
          cat probe/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add probe
          git diff --staged --quiet || (git commit -m "EU API probe results" && git push)
